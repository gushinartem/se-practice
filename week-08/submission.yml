schema: 1
week: "08"

student:
  name: Guchshin Artem
  student_id:   24B031011       # as in KBTU records, e.g. 00X000000
  github:       gushinartem       # your GitHub username, the one that owns the repo

assistant:
  tool:      Claude          # the assistant you debugged with: ChatGPT, Claude, Claude Code, ...
  model:        Haiku 5.5 low       # the exact model with its version, or: not displayed

skill:
  environment:    claude-web     # chatgpt | claude-web | claude-code | prompt-only
  invoked:    yes         # yes | no | not-shown   did the environment show that bug-detector was used?

project:
  language:     ts       # ts | js   the file you copied from buggy/
  vitest:      3.2.7        # the Vitest version from the "RUN  v..." line, e.g. 3.2.4

counts:
  tests_final:    24     # tests in your final suite (app/.../booking.test.*)
  buggy_failed:     5   # failed tests when your Week 07 suite ran on the provided canBook (lab-report.md 2.2)
  defects_logged:    2  # rows in lab-report.md section 3
  lines_changed:     2  # lines of the canBook body you changed to fix both bugs (the checker prints it under B3)

checker:
  # Numbers from YOUR last run of: python tests/check_debugging.py
  # They must add up to the number of checks it runs (31).
  # Report them as they came out.
  # A FAIL you report and explain in lab-report.md costs you nothing. A hidden one costs the criterion.
  pass: 31
  fail: 0
  error: 0
  commit:  e1c112b             # the commit you ran the checker at: git rev-parse --short HEAD
                       # (normally the commit just before you commit this file — that is fine)
  known_fails: []      # every check ID that is still FAIL or ERROR, explained in lab-report.md §9.1, e.g. [E1]

verdict:
  # Your judgement from lab-report.md section 7, against the actual code - not a guess.
  skill_helped:   no-difference     # yes | no | no-difference

review_findings:
  # Three or more. One line each, and each one names what it is about: BUG-A, BUG-B, a test
  # (T01-T14, X1, X2, AC5), an AC, a step of the skill, or a file.
  # Worthless:        "The skill made the answer better"
  # Worth everything: "BUG-B: the AC5 test failed for the wrong reason until BUG-A was fixed - 660-720 was rejected before the push"
  - "BUG-B: the Week 07 AC5 test failed for the wrong reason until BUG-A was fixed - 660-720 touches 600-660, so it was rejected before the push; it dropped from the 5 buggy-code failures into the 2 left after the BUG-A fix only then reaching the push"
  - "BUG-B: my own BUG-B test (720-780, touches nothing) was the only test that proved the mutation on the buggy code, because it failed on bookings growing"
  - "AC5: the no-skill answer claimed its test T05 fails on the buggy code, but it passes there because BUG-A rejects 660-720 before the push runs"
  - "AC5: the skill answer said a booking left in a shared array breaks later tests, but run() builds a fresh bookings array on every call, so that cannot happen in my suite"
  - "Step 7 of the skill: the skill answer ignored the defect | evidence | root cause | fix | test output format and gave no test code, so the skill changed the shape of the answer but not its correctness"

honesty:
  buggy_function_pasted_unchanged: yes   # yes | no   you copied canBook from buggy/ exactly, before any fix
  same_input_both_chats:        yes     # yes | no   sections 5 and 6 sent the same code, criteria and failure
  outputs_unedited:    yes               # yes | no   every run in lab-report.md is pasted from a real terminal
  ai_usage_disclosed:     yes           # yes | no   AI_USAGE.md is complete
